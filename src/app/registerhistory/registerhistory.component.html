<app-loading [visible] = "isLoading"></app-loading>
<div id="card" class="w-11 mt-1 flex justify-content-center"> 
<div id="fade-in-scale" class="w-9">
  <h2 class="flex text-2xl bg-title pl-4 pt-4 m-0 text-indigo-600">History Register</h2>
  <div class="flex justify-content-center w-full">
    <div class="bg-body flex align-items-center justify-content-center w-full h-6rem p-4 mt-0">
      <div class="flex align-items-center gap-0 w-full">
        <div class="w-5 flex align-items-center gap-3">
          <label class="text-indigo-600" for="">From Date</label>
          <p-calendar class="h-2rem" [(ngModel)]="date"
            [style]="{'line-height':'0.5rem','height':'2rem','padding':'0px !important'}">
          </p-calendar>
        </div>
        <div class=" w-5 flex align-items-center gap-3">
          <label class=" text-indigo-600" for="">To Date</label>
          <p-calendar class=" h-2rem" [(ngModel)]="toDate"
            [style]="{'line-height':'0.5rem','height':'2rem','padding':'0px !important'}">
          </p-calendar>
        </div>
        <div class="h-3rem flex w-2 gap-2 align-items-center justify-content-center">
          <p-button type="button" label="Search" severity="info" (click)="search()" styleClass="p-button-sm"
            [raised]="true" [rounded]="true" icon="pi pi-search"></p-button>
          <p-button type="button" label="Export" (click)="exportToExcel()" styleClass="p-button-sm" [rounded]="true" [raised]="true"
            class="" icon="pi pi-file-export"></p-button>
        </div>
      </div>
    </div>
  </div>

  <div class="frame">
    <p-table #dt1 [value]="sMedicals" [paginator]="true" class="w-full" [rows]="row" [rowsPerPageOptions]="[5,10,20]"
      styleClass="p-datatable-sm" [columns]="columnTitles">
      <ng-template pTemplate="header">
        <tr class="fade-slide-in">
          <th *ngFor="let item of columnTitles" [ngClass]="item.classHeader">{{ item.title }}</th>
        </tr>
        <tr>
          <th>Filter</th>
          <th>
            <p-columnFilter type="text" field="fullName" placeholder="Search Name" ariaLabel="Filter FullName"
              [matchMode]="'contains'" [showMenu]="false" />
          </th>
          <th colspan="5"></th>
        </tr>
      </ng-template>

      <ng-template pTemplate="body" let-rowData let-columns="columns" let-rowIndex="rowIndex">
        <tr class="fade-slide-in">
          <td *ngFor="let col of columnTitles" [ngClass]="col.class">
            <ng-container [ngSwitch]="col.field">
              <span *ngSwitchCase="'index'">{{ rowIndex + 1 }}</span>
              <span *ngSwitchCase="'status'" class="p-button flex justify-content-center" [ngClass]="{
                      'bg-active': rowData.status === 'Examined',
                      'bg-disable': rowData.status !== 'Examined'
                    }">
                {{ rowData.status }}
              </span>
              <span *ngSwitchDefault>{{ rowData[col.field] }}</span>
            </ng-container>
          </td>
        </tr>
      </ng-template>

      <ng-template pTemplate="emptymessage" let-sMedicals>
        <tr>
          <td [attr.colspan]="columnTitles.length" class="text-center">
            No customers found
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>
<div class="w-3 bg-white ml-2  w-full flex justify-content-center align-items-center border-solid border-round-md" 
  style="border: 1px solid #e4e4e4;">
    <p-chart type="bar" [data]="chart" [options]="options"/>
  </div>
  </div>
