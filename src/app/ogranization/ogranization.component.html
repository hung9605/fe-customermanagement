<div
  #chartWrapper
  class="card flex justify-content-center align-items-center overflow-x-auto overflow-y-auto "
  style="position: relative; height: 100vh; width: 100vw;"
>

    <p-organizationChart  #chartInner
    [value]="orData" 
    selectionMode="multiple" 
    [(selection)]="selectedNodes" 
    [collapsible]="true"
    class="w-full h-full">
        
      <ng-template let-node pTemplate="person">
        <div class="p-2 text-center">
          <img 
            [src]="node.data.image" 
            class="mb-3 w-3rem h-3rem" />
          <div class="font-bold">
            {{ node.data.name }}
          </div>
          <div>
            {{ node.data.title }}
          </div>
        </div>
      </ng-template>
  
    </p-organizationChart>
  </div>
