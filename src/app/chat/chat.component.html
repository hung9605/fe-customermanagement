
<p-button 
  icon="pi pi-comments"
  class="fixed chat-fab border-circle"
  (click)="show()"
  severity="info"
  rounded
  *ngIf="username != 'tuannd'"
></p-button>
<p-toast></p-toast>
<!-- Hộp thoại chat -->
<app-loading [visible] = "isLoading" style="z-index: 10000;" *ngIf="username != 'tuannd'"></app-loading>
<p-dialog 
  header="💬 Hỗ trợ trực tuyến"
  [(visible)]="visible"
  [modal]="false"
  [dismissableMask]="true"
  [style]="{width: '350px'}"
  [baseZIndex]="10000"
  [position]="'bottomright'">

  <div class="chat-container h-25rem relative">  <!-- 👈 relative để nút có thể absolute -->
 
    <!-- 🔼 Nút Load old nổi trên -->
     <div class="absolute flex w-full justify-content-center align-items-center" *ngIf="showLoadOld">

    <p-button 
      *ngIf="true"
      icon="pi pi-angle-up"
      (click)="loadOld()"
      class="flex "
      [text] = "true"
      pTooltip="Load Old"
      tooltipPosition="top"
      appendTo="body"
      styleClass = "no-shadow"
      ></p-button>
    </div>
    <app-loading [visible] = "isLoading" style="z-index: 10000;"></app-loading>
    <!-- 💬 Danh sách tin nhắn -->
    <div class="chat-messages overflow-y-auto h-full pt-4" #chatMessages (scroll)="onScroll()">
        <!-- <app-loading [visible] = "isLoading"></app-loading> -->
    
      <div *ngFor="let msg of messages" 
           [ngClass]="{
             'user-msg text-right': msg.username != 'tuannd', 
             'support-msg text-left': msg.username == 'tuannd'
           }"
           class="p-1">
        <strong>{{msg.username}}:</strong> {{msg.message}}
      </div>
    </div>
     <!-- 🔽 Nút “Go to Bottom”: chỉ hiện khi user kéo lên xa -->
    <div 
      class="absolute flex w-full justify-content-center align-items-center bottom-5 z-10" style="margin-top: 100%;"
      *ngIf="showGoToBottom">
      <p-button 
        icon="pi pi-angle-down"
        (click)="gotoBottom()"
        class="flex"
        [text]="true"
        pTooltip="Cuộn xuống cuối"
        tooltipPosition="bottom"
        appendTo="body"
        styleClass="no-shadow"
      ></p-button>
    </div>

    <!-- ✉️ Ô nhập -->
    <div class="h-3rem flex gap-2 mt-2">
      <input pInputText class="w-10"
             type="text" 
             placeholder="Nhập tin nhắn..."
             [(ngModel)]="newMessage"
             (keydown.enter)="sendMessage()"/>
      <p-button icon="pi pi-send" 
                class="w-2" 
                styleClass="h-2rem pl-2 pr-2" 
                (click)="sendMessage()" 
                [raised]="true">
      </p-button>
    </div>
  </div>
</p-dialog>
