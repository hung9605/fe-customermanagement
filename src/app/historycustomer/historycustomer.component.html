<app-loading [visible] = "isLoading"></app-loading>
<div id="card" class="w-11 mt-1 flex justify-content-center"> 
<div id="fade-in-scale" class="w-9">
    <h3 class="flex text-2xl bg-title pl-4 pt-4 m-0 text-indigo-600">List Of History Customer</h3>
    <div class="flex justify-content-center w-full">
        <div class="bg-body flex align-items-center justify-content-center w-full h-6rem p-4 mt-0">
          <div class="flex align-items-center gap-0 w-full">
            <div class="w-5 flex align-items-center gap-2">   
            <label class="w-3 text-indigo-600" for="">From Date</label>       
            <p-calendar class="h-2rem w-8" [(ngModel)]="date" 
                [style]="{'line-height':'0.5rem','height':'2rem','padding':'0px !important'}">
            </p-calendar>
            </div>       
            <div class=" w-5 flex align-items-center gap-0">   
            <label class="w-3 text-indigo-600" for="">To Date</label>  
            <p-calendar class=" h-2rem w-8" [(ngModel)]="toDate" 
                [style]="{'line-height':'0.5rem','height':'2rem','padding':'0px !important'}">
            </p-calendar>
            </div>
            <div class="h-3rem flex w-2 gap-2 align-items-center justify-content-center">
                <p-button type="button" label="Search" severity="info" (click)="search()" styleClass="p-button-sm"
                 [raised]="true" [rounded]="true"  icon="pi pi-search"></p-button>
                <p-button type="button" label="Export" (click)="exportToExcel()" styleClass="p-button-sm" [raised]="true"
                 [rounded]="true" class="" icon="pi pi-file-export"></p-button>
            </div>
          </div>
        </div>
      </div>
    <div class="frame">
    <p-table [value]="sMedicals" [paginator]="true"  [rows]="8" [rowsPerPageOptions]="[8,10,20]" [globalFilterFields]="['fullName']"
    styleClass = "p-datatable-sm">
    <ng-template pTemplate="header">
        <tr class="fade-slide-in">
            <th *ngFor="let item of columnTitles" [ngClass]="item.style">{{ item.title }}</th>
        </tr>
        <tr>
            <th>Filter</th>
            <th>
                <p-columnFilter type="text"field="fullName" placeholder="Search Name" ariaLabel="Filter FullName" [matchMode]="'contains'" [showMenu]="false"/>
            </th>
            <th></th>
            <th></th>
            <th></th>
            <th></th>
        </tr>
    </ng-template>
    <ng-template pTemplate="body" let-item let-rowIndex="rowIndex">
        <tr class="fade-slide-in">
            <td class="text-center">{{rowIndex+1}}</td>
            <td class="text-left pl-5">{{item.fullName}}</td>
            <td class="text-center text-indigo-600">{{item.dateRegister}}</td> 
            <td class="text-center text-indigo-600">{{item.timeRegister}}</td>  
            <td class="pl-5 pr-5" >
                <span class="p-button flex justify-content-center" 
                    [ngClass]="{'bg-active': item.status == 'Examined', 'bg-disable': !(item.status == 'Examined')}">
                    {{item.status}} 
                </span>
            </td>
            <td class="text-center">
                <p-button class="ml-1 p-button-icon-only" (click)="show(item)" icon="pi pi-eye" [text]="true"  pTooltip="view" tooltipPosition="right"></p-button>
            </td>
        </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage" let-sMedicals>
        <tr>
            <td colspan="6" class="text-center pt-2 pb-2">
                No customers found
            </td>
        </tr>
    </ng-template>
    </p-table>
</div>
</div>
<div class="w-3 bg-white ml-2  w-full flex justify-content-center align-items-center border-solid border-round-md" 
  style="border: 1px solid #e4e4e4;">
    <p-chart type="bar" [data]="chart" [options]="options"/>
  </div>

</div>
