<div *ngIf="isLoading" class="loading-overlay flex justify-content-center">
  <p-progressSpinner ariaLabel="Loading" strokeWidth="4" animationDuration="1"></p-progressSpinner>
  <span class="mt-2">Loading...</span>
</div>
<div id="fade-in-scale" class="w-9 mt-1">
     <div class="flex justify-content-center w-full">
        <div class="bg flex align-items-center justify-content-center w-full h-6rem p-4">
          <div class="flex align-items-center gap-4 w-full">
            <h4 class="text-indigo-700 m-0 w-6 flex justify-content-start text-xl">Account Management</h4>
            <div class="w-6 flex justify-content-center align-items-center">            
                <input type="text" [(ngModel)]="searchInput" class="border-round-3xl h-2rem w-8"
                pInputText placeholder="Search ..." (keydown)="searchResult($event,dt1)">
                <div class="gap-2 ml-2">
                    <p-button type="button" label="Search" (click)="search(dt1)" styleClass="p-button-sm" [rounded]="true"></p-button>
                </div>
            </div>
          </div>
        </div>
      </div>

  <div class="frame">
    <p-table #dt1 [value]="sUser" [paginator]="true" class="w-full" [rows]="row" [rowsPerPageOptions]="[5,10,20]"
      styleClass="p-datatable-sm" [columns]="columnTitles">
      <ng-template pTemplate="header">
        <tr class="fade-slide-in">
          <th *ngFor="let item of columnTitles" [ngClass]="item.classHeader">{{ item.title }}</th>
        </tr>
        <!-- <tr>
          <th>Filter</th>
          <th>
            <p-columnFilter type="text" field="fullName" placeholder="Search Name" ariaLabel="Filter FullName"
              [matchMode]="'contains'" [showMenu]="false" />
          </th>
          <th colspan="5"></th>
        </tr> -->
      </ng-template>

      <ng-template pTemplate="body" let-rowData let-columns="columns" let-rowIndex="rowIndex">
        <tr class="fade-slide-in">
          <td *ngFor="let col of columnTitles" [ngClass]="col.class">
            <ng-container [ngSwitch]="col.field">
              <span *ngSwitchCase="'index'">{{ rowIndex + 1 }}</span>
              <span *ngSwitchCase="'status'" class="p-button flex justify-content-center" [ngClass]="{
                      'bg-active': rowData.status === 'Examined',
                      'bg-disable': rowData.status !== 'Examined'
                    }">
                {{ rowData.status }}
              </span>
              <span *ngSwitchDefault>{{ rowData[col.field] }}</span>
            </ng-container>
          </td>
        </tr>
      </ng-template>

      <ng-template pTemplate="emptymessage" let-sMedicals>
        <tr>
          <td [attr.colspan]="columnTitles.length" class="text-center">
            No customers found
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>
